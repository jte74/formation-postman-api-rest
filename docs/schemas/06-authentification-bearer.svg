<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>L'authentification par Bearer Token</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1000" height="760" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">L'authentification par Bearer Token</text>
  <text x="500" y="62" text-anchor="middle" font-size="15" fill="#475569">On s'identifie UNE fois pour obtenir un jeton, puis on le présente à CHAQUE requête protégée</text>

  <!-- Acteurs -->
  <rect x="40" y="82" width="200" height="48" rx="10" fill="#ff6c37"/>
  <text x="140" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Postman</text>
  <rect x="760" y="82" width="200" height="48" rx="10" fill="#2563eb"/>
  <text x="860" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">API</text>
  <line x1="140" y1="130" x2="140" y2="560" stroke="#fdba74" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="860" y1="130" x2="860" y2="560" stroke="#93c5fd" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Phase 1 -->
  <rect x="270" y="138" width="460" height="24" rx="12" fill="#f1f5f9"/>
  <text x="500" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">PHASE 1 — OBTENIR LE TOKEN (une fois)</text>

  <line x1="146" y1="196" x2="852" y2="196" stroke="#334155" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="160" y="186" font-size="13.5" fill="#1f2937"><tspan font-weight="700">1.</tspan> <tspan font-family="Consolas, Menlo, monospace">POST /api/auth/token</tspan>   { "nomUtilisateur": "admin", "motDePasse": "Admin123!" }</text>

  <rect x="610" y="210" width="240" height="66" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="730" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">2. vérifie les identifiants</text>
  <text x="730" y="250" text-anchor="middle" font-size="12" fill="#1f2937">crée un JWT signé avec</text>
  <text x="730" y="266" text-anchor="middle" font-size="12" fill="#1f2937">la clé secrète du serveur</text>

  <line x1="852" y1="298" x2="148" y2="298" stroke="#059669" stroke-width="2.5" marker-end="url(#flv)"/>
  <text x="160" y="290" font-size="13.5" fill="#065f46"><tspan font-weight="700">3. 200 OK</tspan>   { "accessToken": "eyJhbGciOi...", "tokenType": "Bearer", "expiresIn": 3600 }</text>

  <rect x="150" y="310" width="300" height="48" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="300" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">4. le script Post-response enregistre</text>
  <text x="300" y="348" text-anchor="middle" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#1f2937">pm.environment.set("token", ...)</text>

  <!-- Phase 2 -->
  <rect x="270" y="372" width="460" height="24" rx="12" fill="#f1f5f9"/>
  <text x="500" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">PHASE 2 — UTILISER LE TOKEN (à chaque requête)</text>

  <line x1="146" y1="430" x2="852" y2="430" stroke="#334155" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="160" y="420" font-size="13.5" fill="#1f2937"><tspan font-weight="700">5.</tspan> <tspan font-family="Consolas, Menlo, monospace">POST /api/produits</tspan>   + header <tspan font-family="Consolas, Menlo, monospace" font-weight="700">Authorization: Bearer eyJhbGciOi...</tspan></text>

  <rect x="560" y="444" width="290" height="82" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="705" y="465" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">6. vérifie le token</text>
  <text x="705" y="483" text-anchor="middle" font-size="12" fill="#1f2937">signature correcte ? émetteur ? audience ?</text>
  <text x="705" y="500" text-anchor="middle" font-size="12" fill="#1f2937">pas expiré ? rôle suffisant ?</text>
  <text x="705" y="517" text-anchor="middle" font-size="11.5" fill="#475569">(aucune base de données consultée)</text>

  <line x1="852" y1="546" x2="148" y2="546" stroke="#059669" stroke-width="2.5" marker-end="url(#flv)"/>
  <text x="160" y="538" font-size="13.5" fill="#065f46"><tspan font-weight="700">7. 201 Created</tspan>  si tout est bon</text>

  <!-- Cas d'erreur -->
  <rect x="20" y="572" width="470" height="78" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="36" y="596" font-size="14" font-weight="700" fill="#b91c1c">401 Unauthorized — « Qui êtes-vous ? »</text>
  <text x="36" y="616" font-size="12.5" fill="#374151">pas de header Authorization, « Bearer » oublié,</text>
  <text x="36" y="634" font-size="12.5" fill="#374151">token mal copié, modifié ou expiré</text>
  <rect x="510" y="572" width="470" height="78" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="526" y="596" font-size="14" font-weight="700" fill="#c2410c">403 Forbidden — « Je sais qui vous êtes, mais non »</text>
  <text x="526" y="616" font-size="12.5" fill="#374151">token valide, mais rôle insuffisant :</text>
  <text x="526" y="634" font-size="12.5" fill="#374151">alice (Utilisateur) ne peut pas faire DELETE</text>

  <!-- Structure JWT -->
  <text x="20" y="680" font-size="14" font-weight="700" fill="#0f172a">Un JWT = 3 parties en Base64, séparées par des points :</text>
  <g font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700">
    <text x="20" y="706"><tspan fill="#dc2626">eyJhbGciOiJIUzI1NiJ9</tspan><tspan fill="#0f172a">.</tspan><tspan fill="#7c3aed">eyJzdWIiOiJhZG1pbiIsInJvbGUiOiJBZG1pbiJ9</tspan><tspan fill="#0f172a">.</tspan><tspan fill="#0284c7">SflKxwRJSMeKKF2QT4fwpM</tspan></text>
  </g>
  <g font-size="12.5">
    <text x="20" y="730" fill="#dc2626" font-weight="700">EN-TÊTE</text><text x="20" y="748" fill="#374151">algorithme (HS256)</text>
    <text x="210" y="730" fill="#7c3aed" font-weight="700">CONTENU (claims)</text><text x="210" y="748" fill="#374151">sub, role, exp : lisible par tous, pas de secret</text>
    <text x="545" y="730" fill="#0284c7" font-weight="700">SIGNATURE</text><text x="545" y="748" fill="#374151">prouve que le token vient du serveur et n'a pas été modifié</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Le dialogue entre Postman, l'API C# et le serveur</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="1000" height="680" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Le dialogue entre Postman, l'API C# et le serveur</text>
  <text x="500" y="62" text-anchor="middle" font-size="15" fill="#475569">Tout se passe sur le poste de formation : Postman appelle http://localhost:5080</text>

  <!-- Poste de formation -->
  <rect x="15" y="80" width="970" height="370" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <text x="35" y="104" font-size="14" font-weight="700" fill="#475569">POSTE DE FORMATION (localhost)</text>

  <!-- Postman -->
  <rect x="35" y="140" width="180" height="270" rx="12" fill="#ff6c37" stroke="#ea580c" stroke-width="2"/>
  <text x="125" y="172" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Postman</text>
  <text x="125" y="194" text-anchor="middle" font-size="13" fill="#fff7ed">le client HTTP</text>
  <rect x="50" y="210" width="150" height="88" rx="8" fill="#ffffff" opacity="0.95"/>
  <text x="125" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">prépare la requête</text>
  <text x="125" y="252" text-anchor="middle" font-size="12" fill="#374151">méthode + URL</text>
  <text x="125" y="270" text-anchor="middle" font-size="12" fill="#374151">headers (token...)</text>
  <text x="125" y="288" text-anchor="middle" font-size="12" fill="#374151">body JSON</text>
  <rect x="50" y="310" width="150" height="86" rx="8" fill="#ffffff" opacity="0.95"/>
  <text x="125" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">affiche la réponse</text>
  <text x="125" y="352" text-anchor="middle" font-size="12" fill="#374151">code, temps, taille</text>
  <text x="125" y="370" text-anchor="middle" font-size="12" fill="#374151">headers + body</text>
  <text x="125" y="388" text-anchor="middle" font-size="12" fill="#374151">résultats des tests</text>

  <!-- Réseau -->
  <line x1="220" y1="230" x2="296" y2="230" stroke="#334155" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="258" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">requête</text>
  <line x1="296" y1="350" x2="220" y2="350" stroke="#059669" stroke-width="2.5" marker-end="url(#flv)"/>
  <text x="258" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">réponse</text>
  <text x="258" y="292" text-anchor="middle" font-size="11" fill="#475569">HTTP</text>
  <text x="258" y="306" text-anchor="middle" font-size="11" fill="#475569">port 5080</text>

  <!-- Processus API -->
  <rect x="300" y="118" width="670" height="314" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="635" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Processus « ProduitsApi » lancé par Visual Studio (F5) ou dotnet run</text>

  <!-- Kestrel -->
  <rect x="315" y="165" width="130" height="245" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Kestrel</text>
  <text x="380" y="224" text-anchor="middle" font-size="12" fill="#1f2937">serveur web</text>
  <text x="380" y="241" text-anchor="middle" font-size="12" fill="#1f2937">intégré à .NET</text>
  <text x="380" y="275" text-anchor="middle" font-size="12" fill="#1f2937">écoute le port</text>
  <text x="380" y="292" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1e3a8a">5080</text>
  <text x="380" y="326" text-anchor="middle" font-size="12" fill="#1f2937">transforme le</text>
  <text x="380" y="343" text-anchor="middle" font-size="12" fill="#1f2937">texte HTTP en</text>
  <text x="380" y="360" text-anchor="middle" font-size="12" fill="#1f2937">objet C#</text>
  <text x="380" y="377" text-anchor="middle" font-size="12" fill="#1f2937">(et inversement)</text>

  <line x1="447" y1="186" x2="472" y2="186" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>

  <!-- Pipeline -->
  <text x="590" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">PIPELINE (Program.cs)</text>
  <g font-size="12.5" fill="#1f2937">
    <rect x="475" y="168" width="230" height="36" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="590" y="191" text-anchor="middle">Journal : 1 ligne par requête</text>
    <rect x="475" y="214" width="230" height="36" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="590" y="237" text-anchor="middle">Gestion des erreurs (500)</text>
    <rect x="475" y="260" width="230" height="36" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="590" y="283" text-anchor="middle">Authentification : lit le token</text>
    <rect x="475" y="306" width="230" height="36" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="590" y="329" text-anchor="middle">Autorisation : [Authorize] (401/403)</text>
    <rect x="475" y="352" width="230" height="36" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="590" y="375" text-anchor="middle">Routage : URL + méthode → action</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="590" y1="204" x2="590" y2="214"/>
    <line x1="590" y1="250" x2="590" y2="260"/>
    <line x1="590" y1="296" x2="590" y2="306"/>
    <line x1="590" y1="342" x2="590" y2="352"/>
  </g>

  <line x1="707" y1="370" x2="733" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>

  <!-- Contrôleur -->
  <rect x="738" y="168" width="215" height="122" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="845" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">ProduitsController</text>
  <text x="845" y="214" text-anchor="middle" font-size="12" fill="#1f2937">lit les paramètres et le body</text>
  <text x="845" y="232" text-anchor="middle" font-size="12" fill="#1f2937">valide les données (400)</text>
  <text x="845" y="250" text-anchor="middle" font-size="12" fill="#1f2937">exécute l'action</text>
  <text x="845" y="268" text-anchor="middle" font-size="12" fill="#1f2937">choisit le code de réponse</text>

  <line x1="825" y1="292" x2="825" y2="322" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="865" y1="322" x2="865" y2="292" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>

  <!-- Store -->
  <path d="M760,334 a85,12 0 0,1 170,0 v58 a85,12 0 0,1 -170,0 z" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <ellipse cx="845" cy="334" rx="85" ry="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="845" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">ProduitStore</text>
  <text x="845" y="388" text-anchor="middle" font-size="12" fill="#047857">liste en mémoire</text>

  <!-- Étapes -->
  <rect x="15" y="468" width="970" height="196" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="35" y="496" font-size="16" font-weight="700" fill="#0f172a">Le trajet d'une requête, étape par étape</text>
  <g font-size="13.5" fill="#1f2937">
    <circle cx="47" cy="522" r="11" fill="#ff6c37"/><text x="47" y="527" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="66" y="527">Postman envoie la requête à localhost:5080.</text>
    <circle cx="47" cy="554" r="11" fill="#3b82f6"/><text x="47" y="559" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text x="66" y="559">Kestrel la reçoit et la transmet au pipeline.</text>
    <circle cx="47" cy="586" r="11" fill="#3b82f6"/><text x="47" y="591" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="66" y="591">Le pipeline vérifie le token et les droits (sinon 401 / 403).</text>
    <circle cx="47" cy="618" r="11" fill="#3b82f6"/><text x="47" y="623" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
    <text x="66" y="623">Le routage choisit la méthode C# à exécuter.</text>

    <circle cx="527" cy="522" r="11" fill="#2563eb"/><text x="527" y="527" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
    <text x="546" y="527">Le contrôleur valide, lit ou modifie les données.</text>
    <circle cx="527" cy="554" r="11" fill="#059669"/><text x="527" y="559" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text>
    <text x="546" y="559">Il construit la réponse : code + headers + JSON.</text>
    <circle cx="527" cy="586" r="11" fill="#059669"/><text x="527" y="591" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text>
    <text x="546" y="591">La réponse repart vers Postman ; la console de l'API</text>
    <text x="546" y="609">affiche : <tspan font-family="Consolas, Menlo, monospace" font-size="12.5">GET /api/produits -&gt; 200 (3 ms)</tspan></text>
    <circle cx="527" cy="636" r="11" fill="#ff6c37"/><text x="527" y="641" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8</text>
    <text x="546" y="641">Postman affiche la réponse et exécute les tests.</text>
  </g>
</svg>

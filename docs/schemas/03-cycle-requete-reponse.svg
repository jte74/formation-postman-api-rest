<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Le cycle d'une requête HTTP et de sa réponse</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Le cycle d'une requête HTTP et de sa réponse</text>
  <text x="500" y="62" text-anchor="middle" font-size="15" fill="#475569">Une requête = une question ; une réponse = UNE réponse. Puis le serveur oublie tout (HTTP est « sans état »).</text>

  <!-- Acteurs -->
  <rect x="30" y="84" width="150" height="50" rx="10" fill="#ff6c37"/>
  <text x="105" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Client (Postman)</text>
  <rect x="820" y="84" width="150" height="50" rx="10" fill="#2563eb"/>
  <text x="895" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Serveur (API)</text>
  <line x1="105" y1="134" x2="105" y2="640" stroke="#fdba74" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="895" y1="134" x2="895" y2="640" stroke="#93c5fd" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Requête -->
  <line x1="110" y1="170" x2="888" y2="170" stroke="#334155" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="500" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">① LA REQUÊTE part du client</text>

  <rect x="190" y="185" width="620" height="200" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <g font-family="Consolas, Menlo, monospace" font-size="14">
    <text x="210" y="216"><tspan fill="#d97706" font-weight="700">POST</tspan><tspan fill="#1f2937"> http://localhost:5080/api/produits</tspan></text>
    <text x="210" y="248" fill="#7c2d12">Content-Type: application/json</text>
    <text x="210" y="270" fill="#7c2d12">Authorization: Bearer eyJhbGciOiJIUzI1NiIs...</text>
    <text x="210" y="304" fill="#1f2937">{ "nom": "Tapis de souris XXL", "prix": 19.90,</text>
    <text x="210" y="326" fill="#1f2937">  "categorie": "Informatique", "stock": 25 }</text>
  </g>
  <g font-size="12.5" fill="#9a3412" font-weight="700">
    <text x="800" y="216" text-anchor="end">LIGNE DE REQUÊTE : méthode + URL</text>
    <text x="800" y="259" text-anchor="end">HEADERS : informations</text>
    <text x="800" y="276" text-anchor="end">sur la requête</text>
    <text x="800" y="315" text-anchor="end">BODY : les données</text>
    <text x="800" y="332" text-anchor="end">(facultatif)</text>
  </g>
  <line x1="205" y1="232" x2="795" y2="232" stroke="#fed7aa"/>
  <line x1="205" y1="284" x2="795" y2="284" stroke="#fed7aa"/>
  <text x="210" y="366" font-size="12.5" fill="#6b7280">Une ligne vide sépare toujours les headers du body. GET et DELETE n'envoient généralement pas de body.</text>

  <!-- Traitement -->
  <rect x="845" y="400" width="100" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="895" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">② traite</text>
  <text x="895" y="443" text-anchor="middle" font-size="11.5" fill="#1f2937">vérifie, valide,</text>
  <text x="895" y="457" text-anchor="middle" font-size="11.5" fill="#1f2937">enregistre</text>

  <!-- Réponse -->
  <line x1="888" y1="482" x2="112" y2="482" stroke="#059669" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="500" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">③ LA RÉPONSE revient au client</text>

  <rect x="190" y="496" width="620" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <g font-family="Consolas, Menlo, monospace" font-size="14">
    <text x="210" y="525"><tspan fill="#047857" font-weight="700">HTTP/1.1 201 Created</tspan></text>
    <text x="210" y="555" fill="#065f46">Content-Type: application/json; charset=utf-8</text>
    <text x="210" y="577" fill="#065f46">Location: http://localhost:5080/api/produits/11</text>
    <text x="210" y="611" fill="#1f2937">{ "id": 11, "nom": "Tapis de souris XXL", ... }</text>
  </g>
  <g font-size="12.5" fill="#047857" font-weight="700">
    <text x="800" y="525" text-anchor="end">LIGNE DE STATUT : code</text>
    <text x="800" y="566" text-anchor="end">HEADERS</text>
    <text x="800" y="611" text-anchor="end">BODY (JSON)</text>
  </g>
  <line x1="205" y1="540" x2="795" y2="540" stroke="#a7f3d0"/>
  <line x1="205" y1="590" x2="795" y2="590" stroke="#a7f3d0"/>

  <!-- Lecture -->
  <rect x="30" y="565" width="150" height="72" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="105" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">④ lit et vérifie</text>
  <text x="105" y="608" text-anchor="middle" font-size="11.5" fill="#1f2937">code = 201 ?</text>
  <text x="105" y="624" text-anchor="middle" font-size="11.5" fill="#1f2937">tests Postman</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Les codes de réponse HTTP</title>
  <rect width="1000" height="600" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Les codes de réponse HTTP</text>
  <text x="500" y="62" text-anchor="middle" font-size="15" fill="#475569">Le premier chiffre donne la famille : il suffit souvent à savoir si tout va bien et qui doit corriger</text>

  <!-- Familles -->
  <g font-size="13">
    <rect x="20" y="84" width="184" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="112" y="114" text-anchor="middle" font-size="22" font-weight="800" fill="#475569">1xx</text>
    <text x="112" y="138" text-anchor="middle" font-weight="700" fill="#334155">Information</text>
    <text x="112" y="160" text-anchor="middle" fill="#6b7280">« patiente »</text>

    <rect x="214" y="84" width="184" height="96" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="306" y="114" text-anchor="middle" font-size="22" font-weight="800" fill="#047857">2xx</text>
    <text x="306" y="138" text-anchor="middle" font-weight="700" fill="#065f46">Succès</text>
    <text x="306" y="160" text-anchor="middle" fill="#374151">« c'est fait »</text>

    <rect x="408" y="84" width="184" height="96" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="500" y="114" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">3xx</text>
    <text x="500" y="138" text-anchor="middle" font-weight="700" fill="#1e3a8a">Redirection</text>
    <text x="500" y="160" text-anchor="middle" fill="#374151">« va voir ailleurs »</text>

    <rect x="602" y="84" width="184" height="96" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="694" y="114" text-anchor="middle" font-size="22" font-weight="800" fill="#c2410c">4xx</text>
    <text x="694" y="138" text-anchor="middle" font-weight="700" fill="#9a3412">Erreur du CLIENT</text>
    <text x="694" y="160" text-anchor="middle" fill="#374151">« votre requête a un souci »</text>

    <rect x="796" y="84" width="184" height="96" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="888" y="114" text-anchor="middle" font-size="22" font-weight="800" fill="#b91c1c">5xx</text>
    <text x="888" y="138" text-anchor="middle" font-weight="700" fill="#991b1b">Erreur du SERVEUR</text>
    <text x="888" y="160" text-anchor="middle" fill="#374151">« c'est moi qui ai planté »</text>
  </g>

  <text x="20" y="214" font-size="15" font-weight="700" fill="#0f172a">Les codes utilisés par l'API de la formation</text>

  <!-- 2xx -->
  <g font-size="13">
    <rect x="20" y="228" width="300" height="352" rx="10" fill="#ecfdf5"/>
    <text x="36" y="254" font-size="14" font-weight="700" fill="#047857">SUCCÈS</text>
    <text x="36" y="284" font-weight="700" fill="#065f46" font-size="14">200 OK</text>
    <text x="36" y="303" fill="#374151">GET, PUT, PATCH réussis</text>
    <text x="36" y="338" font-weight="700" fill="#065f46" font-size="14">201 Created</text>
    <text x="36" y="357" fill="#374151">POST réussi, ressource créée</text>
    <text x="36" y="375" fill="#374151">+ header Location</text>
    <text x="36" y="410" font-weight="700" fill="#065f46" font-size="14">204 No Content</text>
    <text x="36" y="429" fill="#374151">DELETE réussi, pas de body</text>
  </g>

  <!-- 4xx -->
  <g font-size="13">
    <rect x="336" y="228" width="400" height="352" rx="10" fill="#fff7ed"/>
    <text x="352" y="254" font-size="14" font-weight="700" fill="#c2410c">ERREURS DU CLIENT (à corriger dans Postman)</text>
    <text x="352" y="284" font-weight="700" fill="#9a3412" font-size="14">400 Bad Request</text>
    <text x="510" y="284" fill="#374151">données invalides, JSON mal formé</text>
    <text x="352" y="318" font-weight="700" fill="#9a3412" font-size="14">401 Unauthorized</text>
    <text x="510" y="318" fill="#374151">pas de token, token invalide/expiré</text>
    <text x="352" y="352" font-weight="700" fill="#9a3412" font-size="14">403 Forbidden</text>
    <text x="510" y="352" fill="#374151">authentifié mais pas le droit</text>
    <text x="352" y="386" font-weight="700" fill="#9a3412" font-size="14">404 Not Found</text>
    <text x="510" y="386" fill="#374151">id inexistant, URL mal écrite</text>
    <text x="352" y="420" font-weight="700" fill="#9a3412" font-size="14">405 Method Not Allowed</text>
    <text x="530" y="420" fill="#374151">mauvaise méthode pour l'URL</text>
    <text x="352" y="454" font-weight="700" fill="#9a3412" font-size="14">409 Conflict</text>
    <text x="510" y="454" fill="#374151">nom de produit déjà utilisé</text>
    <text x="352" y="488" font-weight="700" fill="#9a3412" font-size="14">415 Unsupported Media Type</text>
    <text x="352" y="507" fill="#374151">body en Text au lieu de JSON (mauvais Content-Type)</text>
    <text x="352" y="548" fill="#6b7280" font-size="12.5">Réflexe : lire le body de la réponse, il explique</text>
    <text x="352" y="566" fill="#6b7280" font-size="12.5">l'erreur (champs title, detail et errors).</text>
  </g>

  <!-- 5xx -->
  <g font-size="13">
    <rect x="752" y="228" width="228" height="352" rx="10" fill="#fef2f2"/>
    <text x="768" y="254" font-size="14" font-weight="700" fill="#b91c1c">ERREUR DU SERVEUR</text>
    <text x="768" y="284" font-weight="700" fill="#991b1b" font-size="14">500 Internal</text>
    <text x="768" y="302" font-weight="700" fill="#991b1b" font-size="14">Server Error</text>
    <text x="768" y="324" fill="#374151">bug ou exception côté API</text>
    <text x="768" y="358" fill="#374151">La requête n'est pas</text>
    <text x="768" y="376" fill="#374151">forcément fautive :</text>
    <text x="768" y="394" fill="#374151">regarder les logs du</text>
    <text x="768" y="412" fill="#374151">serveur (console de l'API)</text>
    <text x="768" y="446" fill="#6b7280" font-size="12.5">Démo : GET /api/demo/erreur</text>
  </g>
</svg>

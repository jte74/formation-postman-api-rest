<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>PUT ou PATCH ?</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">PUT ou PATCH ? Même point de départ, résultats différents</text>
  <text x="500" y="62" text-anchor="middle" font-size="15" fill="#475569">PUT remplace TOUT le produit. PATCH ne touche QUE les champs envoyés.</text>

  <!-- Produit de départ -->
  <rect x="20" y="170" width="250" height="190" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="145" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Produit 11 AVANT</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2937">
    <text x="36" y="226">nom: "Tapis de souris XXL"</text>
    <text x="36" y="250">description: "Tapis 90x40"</text>
    <text x="36" y="274">prix: 19.90</text>
    <text x="36" y="298">categorie: "Informatique"</text>
    <text x="36" y="322">stock: 25</text>
  </g>

  <!-- PUT -->
  <line x1="276" y1="230" x2="336" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="340" y="86" width="290" height="160" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="352" y="98" width="56" height="24" rx="5" fill="#2563eb"/>
  <text x="380" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">PUT</text>
  <text x="418" y="115" font-size="13" font-family="Consolas, Menlo, monospace" fill="#1f2937">/api/produits/11</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2937">
    <text x="356" y="146">{</text>
    <text x="370" y="166">"nom": "Tapis XXL Pro",</text>
    <text x="370" y="186">"prix": 24.90,</text>
    <text x="370" y="206">"categorie": "Informatique",</text>
    <text x="370" y="226">"stock": 30  }</text>
  </g>
  <text x="485" y="262" text-anchor="middle" font-size="12" fill="#1e3a8a">pas de description dans le body</text>

  <line x1="636" y1="166" x2="696" y2="166" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="700" y="86" width="280" height="190" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="840" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">APRÈS le PUT</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5">
    <text x="716" y="142" fill="#1d4ed8" font-weight="700">nom: "Tapis XXL Pro"</text>
    <rect x="712" y="152" width="256" height="22" rx="4" fill="#fee2e2"/>
    <text x="716" y="167" fill="#b91c1c" font-weight="700">description: null  ← effacée !</text>
    <text x="716" y="192" fill="#1d4ed8" font-weight="700">prix: 24.90</text>
    <text x="716" y="216" fill="#1f2937">categorie: "Informatique"</text>
    <text x="716" y="240" fill="#1d4ed8" font-weight="700">stock: 30</text>
  </g>
  <text x="840" y="264" text-anchor="middle" font-size="12" fill="#475569">tous les champs sont remplacés</text>

  <!-- PATCH -->
  <line x1="276" y1="300" x2="336" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="340" y="306" width="290" height="120" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="352" y="318" width="66" height="24" rx="5" fill="#7c3aed"/>
  <text x="385" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">PATCH</text>
  <text x="426" y="335" font-size="13" font-family="Consolas, Menlo, monospace" fill="#1f2937">/api/produits/11</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2937">
    <text x="356" y="376">{ "prix": 17.50 }</text>
  </g>
  <text x="485" y="410" text-anchor="middle" font-size="12" fill="#5b21b6">uniquement le champ à changer</text>

  <line x1="636" y1="376" x2="696" y2="376" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="700" y="296" width="280" height="190" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="840" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">APRÈS le PATCH (depuis AVANT)</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2937">
    <text x="716" y="352">nom: "Tapis de souris XXL"</text>
    <text x="716" y="376">description: "Tapis 90x40"</text>
    <rect x="712" y="386" width="256" height="22" rx="4" fill="#ede9fe"/>
    <text x="716" y="401" fill="#6d28d9" font-weight="700">prix: 17.50  ← seul changement</text>
    <text x="716" y="426">categorie: "Informatique"</text>
    <text x="716" y="450">stock: 25</text>
  </g>
  <text x="840" y="474" text-anchor="middle" font-size="12" fill="#475569">les autres champs sont conservés</text>

  <text x="20" y="410" font-size="13" font-weight="700" fill="#0f172a">À retenir</text>
  <text x="20" y="432" font-size="12.5" fill="#374151">PUT : on envoie le produit complet.</text>
  <text x="20" y="452" font-size="12.5" fill="#374151">PATCH : on envoie la différence.</text>
  <text x="20" y="472" font-size="12.5" fill="#374151">Un PUT incomplet → 400 dans notre API.</text>
</svg>
